version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dynamic-inventory-service
    restart: unless-stopped
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - NODE_ENV=production
      - DB_PATH=./server/data/inventory.db
      - CORS_ORIGIN=http://localhost:3002
    volumes:
      - inventory-data:/app/server/data

volumes:
  inventory-data:
